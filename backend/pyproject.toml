[project]
name = "backend"
version = "0.1.0"
description = "Retail & SME Loan Origination System (LOS) Backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "google-genai>=2.33.0",
    "httpx>=0.28.1",
    "pydantic>=2.0",
    "pydantic-settings>=2.16.0",
    "sse-starlette>=3.5.0",
    "uvicorn[standard]>=0.28.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
